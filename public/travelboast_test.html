<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Route MP4 Generator — TurboSanta Social Studio</title>

  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- MapLibre GL JS (2D Top-Down WebGL Raster Renderer for Crisp 60fps & Canvas MP4 Export) -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- MP4 Muxer for Direct H.264 .mp4 Generation via WebCodecs -->
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>

  <style>
    @font-face {
      font-family: 'Eurostile';
      src: url('/site/Eurostile_Extended_2_Bold.woff2') format('woff2');
      font-weight: bold;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --gold: #FBAF33;
      --gold-bright: #ffd700;
      --gold-dim: rgba(251, 175, 51, 0.14);
      --red: #d31c1c;
      --red-dark: #a81313;
      --bg-dark: #090b10;
      --surface: #12151e;
      --surface-2: #191d29;
      --border: rgba(255, 255, 255, 0.1);
      --border-gold: rgba(251, 175, 51, 0.35);
      --text: #f3f4f6;
      --text-dim: rgba(255, 255, 255, 0.65);
      --text-muted: rgba(255, 255, 255, 0.42);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #161b28 0%, #07080c 100%);
      color: var(--text);
      font-family: 'Open Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .app-shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: 100%;
      height: 100%;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px;
      background: rgba(12, 15, 22, 0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      z-index: 40;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(211, 28, 28, 0.2), rgba(251, 175, 51, 0.15));
      border: 1px solid var(--border-gold);
      border-radius: 10px;
      padding: 6px 11px;
      font-family: 'Eurostile', sans-serif;
      font-size: 12px;
      letter-spacing: 0.8px;
      color: var(--gold);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .route-picker-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .nav-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .nav-icon-btn:hover:not(:disabled) {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(251, 175, 51, 0.12);
    }
    .nav-icon-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .select-input {
      height: 34px;
      background: var(--surface-2);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 700;
      max-width: 300px;
      outline: none;
      cursor: pointer;
    }
    .select-input:focus {
      border-color: var(--gold);
    }
    .select-input option {
      background: #141722;
      color: #fff;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-seg {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 2px;
      gap: 2px;
    }

    .pill-seg button {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .pill-seg button:hover {
      color: #fff;
    }
    .pill-seg button.active {
      background: var(--gold);
      color: #000;
    }

    .btn-tool {
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn-tool:hover {
      border-color: rgba(255, 255, 255, 0.28);
      background: #232838;
    }
    .btn-tool.active {
      border-color: var(--border-gold);
      background: var(--gold-dim);
      color: var(--gold);
    }

    .btn-export {
      height: 36px;
      padding: 0 16px;
      border-radius: 9px;
      border: 1px solid rgba(255, 215, 0, 0.45);
      background: linear-gradient(135deg, #d31c1c 0%, #a51212 100%);
      color: #fff;
      font-family: 'Eurostile', 'Open Sans', sans-serif;
      font-size: 12px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(211, 28, 28, 0.4);
      transition: transform 0.12s ease, box-shadow 0.15s ease;
      white-space: nowrap;
    }
    .btn-export:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(211, 28, 28, 0.6);
    }
    .btn-export:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── CENTER STAGE ── */
    .stage-workspace {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 14px 20px;
      overflow: hidden;
    }

    #stage-frame {
      position: relative;
      width: 380px;
      height: 675px;
      border-radius: 20px;
      overflow: hidden;
      background: #e5e3df;
      border: 3px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(0, 0, 0, 0.8);
      transition: border-color 0.2s ease;
    }

    #stage-frame.is-encoding {
      border-color: var(--gold);
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.85), 0 0 28px rgba(251, 175, 51, 0.35);
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #overlay-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Hide default MapLibre controls */
    .maplibregl-ctrl-bottom-right,
    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-top-right,
    .maplibregl-ctrl-top-left {
      display: none !important;
    }

    /* ── CUSTOMIZE POPOVER DRAWER ── */
    .caption-drawer {
      position: absolute;
      top: 14px;
      right: 18px;
      width: 310px;
      background: rgba(15, 18, 27, 0.96);
      border: 1px solid var(--border-gold);
      border-radius: 14px;
      padding: 16px;
      z-index: 35;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(16px);
      display: none;
    }
    .caption-drawer.open {
      display: block;
    }
    .caption-drawer h4 {
      font-family: 'Eurostile', sans-serif;
      font-size: 12px;
      letter-spacing: 0.8px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .field-group {
      margin-bottom: 10px;
    }
    .field-group label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .field-group input {
      width: 100%;
      height: 32px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 0 10px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }
    .field-group input:focus {
      border-color: var(--gold);
    }

    /* ── BOTTOM PLAYBACK DOCK ── */
    .bottom-dock {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 20px;
      background: rgba(12, 15, 22, 0.94);
      border-top: 1px solid var(--border);
      z-index: 40;
      flex-wrap: wrap;
    }

    .transport-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-play {
      height: 36px;
      min-width: 96px;
      padding: 0 16px;
      border-radius: 9px;
      border: none;
      background: var(--gold);
      color: #000;
      font-weight: 800;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .btn-play:hover {
      background: #ffc04d;
    }

    .timeline-wrap {
      flex: 1;
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .scrubber-track {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    #timeline-scrubber {
      width: 100%;
      accent-color: var(--gold);
      cursor: pointer;
      height: 6px;
    }

    .phase-badge {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      background: var(--gold-dim);
      border: 1px solid var(--border-gold);
      padding: 4px 9px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .time-readout {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      min-width: 86px;
      text-align: right;
      white-space: nowrap;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 700;
    }

    /* ── ENCODING PROGRESS OVERLAY ── */
    .encoding-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 11, 0.72);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 120;
      padding: 20px;
    }
    .encoding-backdrop.active {
      display: flex;
    }

    .encoding-card {
      width: 100%;
      max-width: 420px;
      background: #12151f;
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.85);
    }

    .encoding-card h3 {
      font-family: 'Eurostile', sans-serif;
      font-size: 16px;
      letter-spacing: 0.8px;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .encoding-sub {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    .progress-outer {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--red) 0%, var(--gold) 100%);
      transition: width 0.1s linear;
    }

    .encoding-stats {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--gold);
      margin-bottom: 16px;
    }

    /* ── PREVIEW MODAL ── */
    .preview-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 11, 0.86);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 130;
      padding: 20px;
    }
    .preview-backdrop.active {
      display: flex;
    }

    .preview-card {
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      background: #12151f;
      border: 1px solid var(--border-gold);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.9);
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .preview-header h3 {
      font-family: 'Eurostile', sans-serif;
      font-size: 15px;
      color: var(--gold);
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .preview-video-box {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 62vh;
      border: 1px solid var(--border);
    }
    .preview-video-box video {
      max-width: 100%;
      max-height: 62vh;
      display: block;
    }

    .preview-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ── DRAG DROP & TOAST ── */
    .drop-banner {
      position: fixed;
      inset: 16px;
      border: 3px dashed var(--gold);
      border-radius: 20px;
      background: rgba(12, 15, 22, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      z-index: 200;
      font-family: 'Eurostile', sans-serif;
      color: var(--gold);
      font-size: 20px;
      pointer-events: none;
    }
    .drop-banner.active {
      display: flex;
    }

    .toast {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(15, 18, 27, 0.96);
      border: 1px solid var(--border-gold);
      color: #fff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 150;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 900px) {
      .topbar {
        padding: 8px 12px;
        gap: 8px;
      }
      .select-input {
        max-width: 190px;
      }
      .bottom-dock {
        padding: 8px 12px;
        gap: 10px;
      }
      .zoom-controls {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- TOP TOOLBAR -->
    <header class="topbar">
      <div class="brand-group">
        <div class="brand-badge" title="Top-Down Tracker Route MP4 Generator">
          <i class="fa-solid fa-location-dot"></i>
          <span>Tracker MP4 Studio</span>
        </div>

        <div class="route-picker-wrap">
          <button id="prev-route-btn" class="nav-icon-btn" title="Previous Route">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <select id="route-select" class="select-input" title="Select Scheduled Route">
            <option value="">Loading routes...</option>
          </select>
          <button id="next-route-btn" class="nav-icon-btn" title="Next Route">
            <i class="fa-solid fa-chevron-right"></i>
          </button>

          <label class="btn-tool" for="gpx-file-input" title="Load a local .GPX file">
            <i class="fa-solid fa-upload"></i>
            <span>GPX</span>
          </label>
          <input type="file" id="gpx-file-input" accept=".gpx,application/gpx+xml,text/xml" style="display:none" />
        </div>
      </div>

      <div class="toolbar-actions">
        <!-- Aspect Ratio -->
        <div class="pill-seg" title="Social Video Aspect Ratio">
          <button type="button" data-aspect="9:16" class="active">9:16 Reel</button>
          <button type="button" data-aspect="1:1">1:1 Post</button>
          <button type="button" data-aspect="16:9">16:9 Wide</button>
        </div>

        <!-- Duration Presets -->
        <div class="pill-seg" title="Total MP4 Video Duration (including Final Zoom-Out)">
          <button type="button" data-duration="15">15s</button>
          <button type="button" data-duration="25" class="active">25s</button>
          <button type="button" data-duration="40">40s</button>
        </div>

        <!-- Banner Toggle -->
        <button type="button" id="banner-toggle-btn" class="btn-tool active" title="Toggle Social Title & Tracker URL Overlay">
          <i class="fa-solid fa-rectangle-ad"></i>
          <span>Banner</span>
        </button>

        <!-- Caption / Table Switcher Popover -->
        <button type="button" id="caption-btn" class="btn-tool" title="Edit Route Title, Date Banner or Switch Table">
          <i class="fa-solid fa-sliders"></i>
          <span>Text / Table</span>
        </button>

        <!-- 1-Click MP4 Export -->
        <button type="button" id="export-btn" class="btn-export">
          <i class="fa-solid fa-film"></i>
          <span>Generate MP4</span>
        </button>
      </div>
    </header>

    <!-- CENTER MAP STAGE -->
    <main class="stage-workspace" id="stage-workspace">
      <div id="stage-frame">
        <div id="map"></div>
        <canvas id="overlay-canvas"></canvas>
      </div>

      <!-- Editable Banner Text & Table Switcher Drawer -->
      <aside class="caption-drawer" id="caption-drawer">
        <h4>
          <span>Overlay & Table Settings</span>
          <button type="button" id="caption-close-btn" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </h4>

        <div class="field-group">
          <label for="inp-sleigh-title">Top Brand Heading</label>
          <input type="text" id="inp-sleigh-title" placeholder="e.g. Beverley Round Table Santa Sleigh" />
        </div>

        <div class="field-group">
          <label for="inp-route-title">Route Name</label>
          <input type="text" id="inp-route-title" placeholder="e.g. Route 1 — North Estate" />
        </div>

        <div class="field-group">
          <label for="inp-route-sub">Date & Time Subtitle</label>
          <input type="text" id="inp-route-sub" placeholder="e.g. Thu 4 Dec • 18:00–20:30" />
        </div>

        <div class="field-group">
          <label for="inp-footer-url">Bottom Tracker Callout</label>
          <input type="text" id="inp-footer-url" placeholder="e.g. beverley.roundtablesantasleigh.co.uk" />
        </div>

        <hr style="border:none;border-top:1px solid var(--border);margin:12px 0;" />

        <div class="field-group" style="margin-bottom:0;">
          <label for="inp-table-slug">Load Table Slug</label>
          <div style="display:flex;gap:6px;">
            <input type="text" id="inp-table-slug" placeholder="e.g. beverley" />
            <button type="button" id="btn-load-table" class="btn-tool" style="height:32px;padding:0 12px;">Load</button>
          </div>
        </div>
      </aside>
    </main>

    <!-- BOTTOM PLAYBACK DOCK -->
    <footer class="bottom-dock">
      <div class="transport-controls">
        <button type="button" id="play-btn" class="btn-play">
          <i class="fa-solid fa-play"></i>
          <span>Play</span>
        </button>
        <button type="button" id="restart-btn" class="nav-icon-btn" title="Restart from Start Pin">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </div>

      <div class="timeline-wrap">
        <span id="phase-badge" class="phase-badge">TRAVERSE</span>
        <div class="scrubber-track">
          <input type="range" id="timeline-scrubber" min="0" max="1000" step="1" value="0" />
        </div>
        <span id="time-readout" class="time-readout">0.0s / 25.0s</span>
      </div>

      <div class="zoom-controls">
        <span>Follow Zoom</span>
        <div class="pill-seg">
          <button type="button" data-zoom="15.7">Wide</button>
          <button type="button" data-zoom="16.4" class="active">Std</button>
          <button type="button" data-zoom="17.1">Close</button>
        </div>
      </div>
    </footer>
  </div>

  <!-- ENCODING PROGRESS MODAL -->
  <div class="encoding-backdrop" id="encoding-backdrop">
    <div class="encoding-card">
      <h3 id="encoding-title">Generating Social MP4...</h3>
      <p class="encoding-sub" id="encoding-sub">Rendering crisp top-down tracker tiles & pin path</p>
      <div class="progress-outer">
        <div class="progress-inner" id="encoding-bar"></div>
      </div>
      <div class="encoding-stats" id="encoding-stats">0% • Frame 0 / 0</div>
      <button type="button" id="encoding-cancel-btn" class="btn-tool" style="margin:0 auto;">
