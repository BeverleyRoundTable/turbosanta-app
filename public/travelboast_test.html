  <div class="toast" id="toast"></div>

  <script>
    (function () {
      'use strict';

      const WORKER_API = 'https://turbosanta-api.beverley247.workers.dev';
      const DEFAULT_ICONS = {
        live: '/icons/sleigh_icon.png',
        start: '/icons/start_icon.png',
        end: '/icons/end_icon.png',
        stop: '/icons/stop_icon.png',
        logo: '/icons/RTBI_Santa.png'
      };

      const ASPECT_CONFIGS = {
        '9:16': { ratio: 9 / 16, width: 1080, height: 1920, fallbackW: 720, fallbackH: 1280, designW: 420 },
        '1:1':  { ratio: 1,      width: 1080, height: 1080, fallbackW: 720, fallbackH: 720,  designW: 480 },
        '16:9': { ratio: 16 / 9, width: 1920, height: 1080, fallbackW: 1280, fallbackH: 720, designW: 680 }
      };

      const FALLBACK_GPX_ROUTES = [
        { id: 'demo_htog', name: 'Beverley — Highgate to Grovehill', date: '', start_time: '18:00', end_time: '20:30', gpxUrl: '/gpx/HtoG.gpx' },
        { id: 'demo_gtoh', name: 'Beverley — Grovehill to Highgate', date: '', start_time: '18:00', end_time: '20:30', gpxUrl: '/gpx/GtoH.gpx' },
        { id: 'demo_wtoh', name: 'Beverley — Woodhall to Highgate',  date: '', start_time: '18:00', end_time: '20:30', gpxUrl: '/gpx/WtoH.gpx' }
      ];

      const $ = (id) => document.getElementById(id);

      const STATE = {
        tableSlug: 'beverley',
        settings: {},
        routes: [],
        activeRouteIndex: -1,
        activeRoute: null,

        // Parsed GPX geometry
        points: [],          // [{ lat, lng, dist }]
        cameraTrack: [],     // Gaussian-smoothed [{ lat, lng }] for calm cul-de-sac follow
        stops: [],           // [{ lat, lng, name }]
        totalDistMeters: 0,
        bounds: null,        // [[minLng, minLat], [maxLng, maxLat]]

        // Playback & Camera
        aspect: '9:16',
        durationSecs: 25,
        followZoom: 16.4,
        includeBanner: true,
        isPlaying: false,
        currentTimeSec: 0,
        lastFrameTs: 0,

        // Banner text
        sleighTitle: 'Round Table Santa Sleigh',
        routeTitle: 'Santa Sleigh Route',
        routeSubtitle: '',
        footerUrl: 'roundtablesantasleigh.co.uk',

        // Loaded CORS-clean Image objects
        icons: {
          live: null,
          start: null,
          end: null,
          stop: null,
          logo: null
        },

        // Export state
        isExporting: false,
        cancelExport: false,
        lastExportBlobUrl: null,
        lastExportFilename: 'SantaSleigh_Route.mp4'
      };

      let map = null;
      let mapLoaded = false;
      const overlayCanvas = $('overlay-canvas');
      const overlayCtx = overlayCanvas.getContext('2d');

      // ─────────────────────────────────────────────────────────
      // URL & TENANT HELPERS
      // ─────────────────────────────────────────────────────────
      function resolveTableSlug() {
        const params = new URLSearchParams(window.location.search);
        const qTable = (params.get('table') || params.get('slug') || '').trim().toLowerCase();
        if (qTable) return qTable;

        const hostMatch = window.location.hostname.match(/^([a-z0-9-]+)\.roundtablesantasleigh\.co\.uk$/i);
        if (hostMatch && !['www', 'api', 'admin', 'national'].includes(hostMatch[1].toLowerCase())) {
          return hostMatch[1].toLowerCase();
        }

        try {
          const savedSlug = localStorage.getItem('ts_selected_table');
          if (savedSlug && savedSlug.trim()) return savedSlug.trim().toLowerCase();
          const rawSession = localStorage.getItem('turbosanta_admin_session');
          if (rawSession) {
            const parsed = JSON.parse(rawSession);
            if (parsed?.tableSlug) return String(parsed.tableSlug).toLowerCase();
            if (parsed?.tableId) return String(parsed.tableId).toLowerCase();
          }
        } catch (_) {}

        return 'beverley';
      }

      function resolveAssetUrl(rawUrl) {
        const s = String(rawUrl || '').trim();
        if (!s) return '';
        if (s.startsWith('data:') || s.startsWith('blob:') || /^https?:\/\//i.test(s)) return s;
        if (s.startsWith('//')) return 'https:' + s;
        if (s.startsWith('/cdn/')) return WORKER_API + s;
        if (s.startsWith('/')) return s;
        return 'https://' + s.replace(/^\/+/, '');
      }

      function showToast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('visible');
        clearTimeout(showToast._tid);
        showToast._tid = setTimeout(() => t.classList.remove('visible'), 2800);
      }

      function loadCorsImage(primaryUrl, fallbackUrl) {
        return new Promise((resolve) => {
          const tryLoad = (url, isFallback) => {
            if (!url) {
              if (!isFallback && fallbackUrl) return tryLoad(fallbackUrl, true);
              return resolve(null);
            }
            const resolved = resolveAssetUrl(url);
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => resolve(img);
            img.onerror = () => {
              if (!isFallback && fallbackUrl && fallbackUrl !== url) {
                tryLoad(fallbackUrl, true);
              } else {
                resolve(null);
              }
            };
            // Avoid non-CORS browser cache hits on external CDN images
            if (/^https?:\/\//i.test(resolved) && !resolved.startsWith(window.location.origin)) {
              const sep = resolved.includes('?') ? '&' : '?';
              img.src = resolved + sep + 'v_cors=1';
            } else {
              img.src = resolved;
            }
          };
          tryLoad(primaryUrl || fallbackUrl, !primaryUrl);
        });
      }

      async function loadTableIcons(settings) {
        const [live, start, end, stop, logo] = await Promise.all([
          loadCorsImage(settings?.sleigh_icon_live, DEFAULT_ICONS.live),
          loadCorsImage(settings?.sleigh_icon_start, DEFAULT_ICONS.start),
          loadCorsImage(settings?.sleigh_icon_end, DEFAULT_ICONS.end),
          loadCorsImage(settings?.sleigh_icon_stop || settings?.sleigh_icon_start, DEFAULT_ICONS.stop),
          loadCorsImage(settings?.logo_url, DEFAULT_ICONS.logo)
        ]);
        STATE.icons = { live, start, end, stop, logo };
      }

      // ─────────────────────────────────────────────────────────
      // GEOMETRY & GPX PARSING
      // ─────────────────────────────────────────────────────────
      function haversineMeters(a, b) {
        const R = 6371000;
        const toRad = Math.PI / 180;
        const dLat = (b.lat - a.lat) * toRad;
        const dLng = (b.lng - a.lng) * toRad;
        const s1 = Math.sin(dLat / 2);
        const s2 = Math.sin(dLng / 2);
        const q = s1 * s1 + Math.cos(a.lat * toRad) * Math.cos(b.lat * toRad) * s2 * s2;
        return 2 * R * Math.atan2(Math.sqrt(q), Math.sqrt(1 - q));
      }

      function parseGpxXml(xmlText) {
        const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
        const wpts = Array.from(xml.getElementsByTagName('wpt')).map((w) => ({
          lat: parseFloat(w.getAttribute('lat')),
          lng: parseFloat(w.getAttribute('lon')),
          name: (w.getElementsByTagName('name')[0]?.textContent || 'Planned Stop').trim()
        })).filter((w) => Number.isFinite(w.lat) && Number.isFinite(w.lng));

        let rawNodes = Array.from(xml.getElementsByTagName('trkpt'));
        if (rawNodes.length < 2) {
          rawNodes = Array.from(xml.getElementsByTagName('rtept'));
        }

        const pts = [];
        let cumDist = 0;
        let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;

        for (let i = 0; i < rawNodes.length; i++) {
          const lat = parseFloat(rawNodes[i].getAttribute('lat'));
          const lng = parseFloat(rawNodes[i].getAttribute('lon'));
          if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;

          if (pts.length > 0) {
            const step = haversineMeters(pts[pts.length - 1], { lat, lng });
            if (step < 0.4) continue; // skip duplicate vertices
            cumDist += step;
          }

          pts.push({ lat, lng, dist: cumDist });
          if (lat < minLat) minLat = lat;
          if (lat > maxLat) maxLat = lat;
          if (lng < minLng) minLng = lng;
          if (lng > maxLng) maxLng = lng;
        }

        if (pts.length < 2) {
          throw new Error('GPX track contains fewer than 2 valid coordinates.');
        }

        // Precompute smoothed camera follow path (tapered at Start & Finish so endpoints match 100%)
        const smoothRadiusMeters = 135;
        const camTrack = pts.map((pt, idx) => {
          const edgeTaper = Math.min(1, pt.dist / 180, (cumDist - pt.dist) / 180);
          const win = smoothRadiusMeters * edgeTaper;
          if (win < 2) return { lat: pt.lat, lng: pt.lng };

          let sumLat = 0, sumLng = 0, sumW = 0;
          for (let j = idx; j >= 0 && (pt.dist - pts[j].dist) <= win; j--) {
            const d = pt.dist - pts[j].dist;
            const w = Math.cos((d / win) * (Math.PI / 2));
            sumLat += pts[j].lat * w;
            sumLng += pts[j].lng * w;
            sumW += w;
          }
          for (let j = idx + 1; j < pts.length && (pts[j].dist - pt.dist) <= win; j++) {
            const d = pts[j].dist - pt.dist;
            const w = Math.cos((d / win) * (Math.PI / 2));
            sumLat += pts[j].lat * w;
            sumLng += pts[j].lng * w;
            sumW += w;
          }
          let cLat = sumW > 0 ? sumLat / sumW : pt.lat;
          let cLng = sumW > 0 ? sumLng / sumW : pt.lng;

          // Clamp max offset so Santa pin never drifts near screen edge in deep cul-de-sacs
          const drift = haversineMeters(pt, { lat: cLat, lng: cLng });
          if (drift > 65) {
            const k = 65 / drift;
            cLat = pt.lat + (cLat - pt.lat) * k;
            cLng = pt.lng + (cLng - pt.lng) * k;
          }
          return { lat: cLat, lng: cLng };
        });

        return {
          points: pts,
          cameraTrack: camTrack,
          stops: wpts,
          totalDistMeters: cumDist,
          bounds: [[minLng, minLat], [maxLng, maxLat]]
        };
      }

      // Binary search interpolation along cumulative distance
      function sampleRouteAtProgress(progress01) {
        const pts = STATE.points;
        if (!pts.length) return null;
        if (progress01 <= 0) {
          return {
            lat: pts[0].lat,
            lng: pts[0].lng,
            camLat: STATE.cameraTrack[0].lat,
            camLng: STATE.cameraTrack[0].lng,
            index: 0,
            frac: 0,
            targetDist: 0
          };
        }
        if (progress01 >= 1) {
          const last = pts.length - 1;
          return {
            lat: pts[last].lat,
            lng: pts[last].lng,
            camLat: STATE.cameraTrack[last].lat,
            camLng: STATE.cameraTrack[last].lng,
            index: last - 1,
            frac: 1,
            targetDist: STATE.totalDistMeters
          };
        }

        const targetDist = progress01 * STATE.totalDistMeters;
        let lo = 0, hi = pts.length - 1;
        while (lo < hi - 1) {
          const mid = (lo + hi) >> 1;
          if (pts[mid].dist <= targetDist) lo = mid;
          else hi = mid;
        }

        const p0 = pts[lo];
        const p1 = pts[hi];
        const segLen = Math.max(0.0001, p1.dist - p0.dist);
        const frac = Math.min(1, Math.max(0, (targetDist - p0.dist) / segLen));

        const c0 = STATE.cameraTrack[lo];
        const c1 = STATE.cameraTrack[hi];

        return {
          lat: p0.lat + (p1.lat - p0.lat) * frac,
          lng: p0.lng + (p1.lng - p0.lng) * frac,
          camLat: c0.lat + (c1.lat - c0.lat) * frac,
          camLng: c0.lng + (c1.lng - c0.lng) * frac,
          index: lo,
          frac,
          targetDist
        };
      }

      // ─────────────────────────────────────────────────────────
      // MAP INITIALIZATION (STRICTLY TOP-DOWN OPENSTREETMAP)
      // ─────────────────────────────────────────────────────────
      function resizeStageToFit() {
        const workspace = $('stage-workspace');
        const frame = $('stage-frame');
        const cfg = ASPECT_CONFIGS[STATE.aspect] || ASPECT_CONFIGS['9:16'];

        const availW = Math.max(240, workspace.clientWidth - 32);
        const availH = Math.max(240, workspace.clientHeight - 24);

        let w = availW;
        let h = w / cfg.ratio;
        if (h > availH) {
          h = availH;
          w = h * cfg.ratio;
        }

        frame.style.width = Math.round(w) + 'px';
        frame.style.height = Math.round(h) + 'px';

        const dpr = Math.min(3, Math.max(window.devicePixelRatio || 1, 2));
        overlayCanvas.width = Math.round(w * dpr);
        overlayCanvas.height = Math.round(h * dpr);

        if (map) {
          map.resize();
          renderCurrentTimelineState();
        }
      }

      function initMap() {
        resizeStageToFit();

        map = new maplibregl.Map({
          container: 'map',
          preserveDrawingBuffer: true,
          antialias: true,
          fadeDuration: 0,
          maxTileCacheSize: 1000,
          pixelRatio: Math.min(3, Math.max(window.devicePixelRatio || 1, 2.25)),
          attributionControl: false,
          center: [-0.435, 53.842],
          zoom: 15,
          pitch: 0,
          maxPitch: 0,
          bearing: 0,
          dragRotate: false,
          touchPitch: false,
          pitchWithRotate: false,
          keyboard: false,
          style: {
            version: 8,
            sources: {
              'osm-tracker-tiles': {
                type: 'raster',
                tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                tileSize: 256,
                maxzoom: 19
              }
            },
            layers: [
              {
                id: 'osm-tracker-layer',
                type: 'raster',
                source: 'osm-tracker-tiles',
                minzoom: 0,
                maxzoom: 22
              }
            ]
          }
        });

        map.on('load', () => {
          mapLoaded = true;

          map.addSource('gpx-route-remaining', {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: [] }
          });

          map.addSource('gpx-route-past', {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: [] }
          });

          map.addSource('sleigh-tail', {
            type: 'geojson',
            lineMetrics: true,
            data: { type: 'FeatureCollection', features: [] }
          });

          // Remaining route ahead (matches tracker.html: Gold outer glow + Red core)
          map.addLayer({
            id: 'route-remaining-glow',
            type: 'line',
            source: 'gpx-route-remaining',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: {
              'line-color': '#ffd700',
              'line-width': ['interpolate', ['linear'], ['zoom'], 12, 6, 15, 9, 17, 13],
              'line-opacity': 0.45,
              'line-blur': 3
            }
          });

          map.addLayer({
            id: 'route-remaining-main',
            type: 'line',
            source: 'gpx-route-remaining',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: {
              'line-color': '#d31c1c',
              'line-width': ['interpolate', ['linear'], ['zoom'], 12, 3, 15, 4.5, 17, 6.5],
              'line-opacity': 0.95
            }
          });

          // Traversed route behind pin (Gold glow + crisp crimson casing for zoomed-out contrast + bright Gold core)
          map.addLayer({
            id: 'route-past-glow',
            type: 'line',
            source: 'gpx-route-past',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: {
              'line-color': '#ffd700',
              'line-width': ['interpolate', ['linear'], ['zoom'], 12, 7, 15, 10, 17, 14],
              'line-opacity': 0.5,
              'line-blur': 3
            }
          });

          map.addLayer({
            id: 'route-past-casing',
            type: 'line',
            source: 'gpx-route-past',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: {
              'line-color': '#b91c1c',
              'line-width': ['interpolate', ['linear'], ['zoom'], 12, 5, 15, 6.8, 17, 9],
              'line-opacity': 0.85
            }
          });

          map.addLayer({
            id: 'route-past-main',
            type: 'line',
            source: 'gpx-route-past',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: {
              'line-color': '#ffd700',
              'line-width': ['interpolate', ['linear'], ['zoom'], 12, 3, 15, 4.5, 17, 6.5],
              'line-opacity': 0.98
            }
          });

          // Live tracker golden motion tail right behind Santa pin
          map.addLayer({
            id: 'sleigh-tail-layer',
            type: 'line',
            source: 'sleigh-tail',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: {
              'line-width': ['interpolate', ['linear'], ['zoom'], 12, 4, 15, 6.5, 17, 8.5],
              'line-gradient': [
                'interpolate', ['linear'], ['line-progress'],
                0, 'rgba(251, 175, 51, 0)',
                1, '#FBAF33'
              ]
            }
          });

          loadTablePayload(STATE.tableSlug);
        });

        map.on('render', () => {
          if (!STATE.isExporting) {
            drawScreenOverlay();
          }
        });
      }

      // ─────────────────────────────────────────────────────────
      // TIMELINE & CAMERA CHOREOGRAPHY (TRAVERSE + PAN ZOOM OUT)
      // ─────────────────────────────────────────────────────────
      function easeInOutCubic(x) {
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      }

      function smoothTraverseRamp(u) {
        // Gentle 2.5% velocity ease-in and ease-out at Start and Finish
        const k = 0.025;
        if (u <= 0) return 0;
        if (u >= 1) return 1;
        const denom = 1 - k;
        if (u < k) {
          return (u * u) / (2 * k * denom);
        }
        if (u > 1 - k) {
          const d = 1 - u;
          return 1 - (d * d) / (2 * k * denom);
        }
        return (u - k / 2) / denom;
      }

      function getTimelinePhases() {
        const D = STATE.durationSecs;
        const introHold = Math.min(1.5, Math.max(1.0, D * 0.055));
        const outroHold = Math.min(2.8, Math.max(1.8, D * 0.09));
        const panOutDur = Math.min(4.2, Math.max(2.8, D * 0.16));
        const traverseDur = Math.max(4.0, D - introHold - panOutDur - outroHold);
        return { introHold, traverseDur, panOutDur, outroHold, total: D };
      }

      function getOverviewCamera() {
        if (!map || !STATE.bounds) {
          return { center: [-0.435, 53.842], zoom: 13.5 };
        }
        const frame = $('stage-frame');
        const w = frame.clientWidth || 380;
        const h = frame.clientHeight || 675;

        const padding = {
          top: Math.round(STATE.includeBanner ? h * 0.21 : h * 0.10),
          bottom: Math.round(STATE.includeBanner ? h * 0.13 : h * 0.10),
          left: Math.round(w * 0.11),
          right: Math.round(w * 0.11)
        };

        const cam = map.cameraForBounds(STATE.bounds, {
          padding,
          bearing: 0,
          pitch: 0
        });

        if (!cam || !cam.center) {
          return { center: [STATE.points[0].lng, STATE.points[0].lat], zoom: 13.5 };
        }

        const c = Array.isArray(cam.center) ? cam.center : [cam.center.lng, cam.center.lat];
        // Guarantee a genuine zoom-out relative to followZoom
        const z = Math.min(STATE.followZoom - 1.1, Math.max(9.5, cam.zoom ?? 13.5));
        return { center: c, zoom: z };
      }

      function evaluateStateAtTime(tSec) {
        if (!STATE.points.length) return null;
        const phases = getTimelinePhases();
        const t = Math.max(0, Math.min(phases.total, tSec));

        let phase = 'TRAVERSE';
        let routeProgress = 0;
        let panOutProgress = 0;
        let centerLng = STATE.points[0].lng;
        let centerLat = STATE.points[0].lat;
        let zoom = STATE.followZoom;

        if (t <= phases.introHold) {
          phase = 'START';
          routeProgress = 0;
          const samp = sampleRouteAtProgress(0);
          centerLng = samp.camLng;
          centerLat = samp.camLat;
          zoom = STATE.followZoom;
        } else if (t <= phases.introHold + phases.traverseDur) {
          phase = 'TRAVERSE';
          const rawU = (t - phases.introHold) / phases.traverseDur;
          routeProgress = smoothTraverseRamp(rawU);
          const samp = sampleRouteAtProgress(routeProgress);
          centerLng = samp.camLng;
          centerLat = samp.camLat;
          zoom = STATE.followZoom;
        } else if (t <= phases.introHold + phases.traverseDur + phases.panOutDur) {
          phase = 'ZOOM OUT';
          routeProgress = 1;
          const rawP = (t - phases.introHold - phases.traverseDur) / phases.panOutDur;
          const e = easeInOutCubic(Math.min(1, Math.max(0, rawP)));
          panOutProgress = e;

          const endSamp = sampleRouteAtProgress(1);
          const ov = getOverviewCamera();
          const z0 = STATE.followZoom;
          const z1 = ov.zoom;
          zoom = z0 + (z1 - z0) * e;

          // Screen-linear Van Wijk zoom-pan interpolation so the Finish pin glides smoothly without whipping
          let wCenter = e;
          if (Math.abs(z0 - z1) > 0.05) {
            wCenter = (Math.pow(2, z0 - zoom) - 1) / (Math.pow(2, z0 - z1) - 1);
          }
          centerLng = endSamp.camLng + (ov.center[0] - endSamp.camLng) * wCenter;
          centerLat = endSamp.camLat + (ov.center[1] - endSamp.camLat) * wCenter;
        } else {
          phase = 'OVERVIEW';
          routeProgress = 1;
          panOutProgress = 1;
          const ov = getOverviewCamera();
          centerLng = ov.center[0];
          centerLat = ov.center[1];
          zoom = ov.zoom;
        }

        const sleighSample = sampleRouteAtProgress(routeProgress);
        return {
          t,
          phase,
          routeProgress,
          panOutProgress,
          sleighSample,
          camera: {
            center: [centerLng, centerLat],
            zoom,
            pitch: 0,
            bearing: 0
          }
        };
      }

      function updateRouteGeoJson(sleighSample, routeProgress) {
        if (!mapLoaded || !STATE.points.length || !sleighSample) return;

        const pts = STATE.points;
        const curCoord = [sleighSample.lng, sleighSample.lat];

        // Past coordinates (0 .. index + current interpolated tip)
        const pastCoords = [];
        for (let i = 0; i <= sleighSample.index; i++) {
          pastCoords.push([pts[i].lng, pts[i].lat]);
        }
        pastCoords.push(curCoord);

        // Remaining coordinates (current interpolated tip .. end)
        const remCoords = [curCoord];
        for (let i = sleighSample.index + 1; i < pts.length; i++) {
          remCoords.push([pts[i].lng, pts[i].lat]);
        }

        // Tail coordinates (~180m behind sleigh, fading out during final overview)
        const tailCoords = [];
        if (routeProgress > 0.002 && routeProgress < 0.999) {
          const minTailDist = Math.max(0, sleighSample.targetDist - 180);
          for (let i = 0; i <= sleighSample.index; i++) {
            if (pts[i].dist >= minTailDist) {
              tailCoords.push([pts[i].lng, pts[i].lat]);
            }
          }
          tailCoords.push(curCoord);
        }

        const srcPast = map.getSource('gpx-route-past');
        const srcRem = map.getSource('gpx-route-remaining');
        const srcTail = map.getSource('sleigh-tail');

        if (srcPast) {
          srcPast.setData(pastCoords.length >= 2 && routeProgress > 0
            ? { type: 'Feature', geometry: { type: 'LineString', coordinates: pastCoords } }
            : { type: 'FeatureCollection', features: [] });
        }
        if (srcRem) {
          srcRem.setData(remCoords.length >= 2 && routeProgress < 1
            ? { type: 'Feature', geometry: { type: 'LineString', coordinates: remCoords } }
            : { type: 'FeatureCollection', features: [] });
        }
        if (srcTail) {
          srcTail.setData(tailCoords.length >= 2
            ? { type: 'Feature', geometry: { type: 'LineString', coordinates: tailCoords } }
            : { type: 'FeatureCollection', features: [] });
        }
      }

      function applyTimelineState(snap) {
        if (!snap || !mapLoaded) return;
        updateRouteGeoJson(snap.sleighSample, snap.routeProgress);
        map.jumpTo(snap.camera);

        // Update UI readouts
        $('phase-badge').textContent = snap.phase;
        $('time-readout').textContent = `${snap.t.toFixed(1)}s / ${STATE.durationSecs.toFixed(1)}s`;
        const sliderVal = Math.round((snap.t / STATE.durationSecs) * 1000);
        if (document.activeElement !== $('timeline-scrubber')) {
          $('timeline-scrubber').value = String(sliderVal);
        }
      }

      function renderCurrentTimelineState() {
        const snap = evaluateStateAtTime(STATE.currentTimeSec);
        if (snap) {
          applyTimelineState(snap);
          drawScreenOverlay(snap);
        }
      }

      // ─────────────────────────────────────────────────────────
      // 2D OVERLAY RENDERER (SHARED BY LIVE STAGE & MP4 ENCODER)
      // ─────────────────────────────────────────────────────────
      function drawAnchoredImage(ctx, img, x, y, boxSize, anchorXRatio, anchorYRatio) {
        if (!img || !img.naturalWidth || !img.naturalHeight) return;
        const scale = Math.min(boxSize / img.naturalWidth, boxSize / img.naturalHeight);
        const w = img.naturalWidth * scale;
        const h = img.naturalHeight * scale;
        const drawX = x - w * anchorXRatio;
        const drawY = y - h * anchorYRatio;
        ctx.drawImage(img, drawX, drawY, w, h);
      }

      function roundRectPath(ctx, x, y, w, h, r) {
        const rad = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rad, y);
        ctx.arcTo(x + w, y, x + w, y + h, rad);
        ctx.arcTo(x + w, y + h, x, y + h, rad);
        ctx.arcTo(x, y + h, x, y, rad);
        ctx.arcTo(x, y, x + w, y, rad);
        ctx.closePath();
      }

      function fitText(ctx, text, maxWidth) {
        const s = String(text || '').trim();
        if (!s || ctx.measureText(s).width <= maxWidth) return s;
        let out = s;
        while (out.length > 4 && ctx.measureText(out + '…').width > maxWidth) {
          out = out.slice(0, -1);
        }
        return out + '…';
      }

      function drawTrackerOverlays(ctx, canvasW, canvasH, snap) {
        if (!map || !STATE.points.length) return;
        const activeSnap = snap || evaluateStateAtTime(STATE.currentTimeSec);
        if (!activeSnap) return;

        const frame = $('stage-frame');
        const stageCssW = Math.max(1, frame.clientWidth);
        const stageCssH = Math.max(1, frame.clientHeight);

        const cfg = ASPECT_CONFIGS[STATE.aspect] || ASPECT_CONFIGS['9:16'];
        const uiScale = canvasW / cfg.designW;
        // Slightly compact markers during zoomed-out overview so pins stay neat
        const overviewPinScale = 1 - 0.16 * (activeSnap.panOutProgress || 0);

        const projectToCanvas = (lng, lat) => {
          const p = map.project([lng, lat]);
          return {
            x: (p.x / stageCssW) * canvasW,
            y: (p.y / stageCssH) * canvasH
          };
        };

        ctx.save();

        // 1. Planned GPX Stops (<wpt>)
        if (STATE.stops.length > 0 && STATE.icons.stop) {
          const stopSize = 28 * uiScale * overviewPinScale;
          ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
          ctx.shadowBlur = 6 * uiScale;
          ctx.shadowOffsetY = 2 * uiScale;
          for (const st of STATE.stops) {
            const pt = projectToCanvas(st.lng, st.lat);
            drawAnchoredImage(ctx, STATE.icons.stop, pt.x, pt.y, stopSize, 0.5, 0.5);
          }
        }

        // 2. Start & Finish Pins (matching tracker.html 48x48 bottom-center anchor [24, 48])
        const startPt = STATE.points[0];
        const endPt = STATE.points[STATE.points.length - 1];
        const markerSize = 44 * uiScale * overviewPinScale;

        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = 8 * uiScale;
        ctx.shadowOffsetY = 3 * uiScale;

        if (STATE.icons.start) {
          const pStart = projectToCanvas(startPt.lng, startPt.lat);
          drawAnchoredImage(ctx, STATE.icons.start, pStart.x, pStart.y, markerSize, 0.5, 1.0);
        }
        if (STATE.icons.end) {
          const pEnd = projectToCanvas(endPt.lng, endPt.lat);
          drawAnchoredImage(ctx, STATE.icons.end, pEnd.x, pEnd.y, markerSize, 0.5, 1.0);
        }

        // 3. Moving Tracker Pin Icon (matching tracker.html 64x64 anchor [32, 60])
        const sleighCoord = activeSnap.sleighSample;
        if (sleighCoord) {
          const pSleigh = projectToCanvas(sleighCoord.lng, sleighCoord.lat);
          const sleighSize = 62 * uiScale * overviewPinScale;

          // Crisp GPS road contact dot directly beneath tracker pin tip
          ctx.save();
          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.arc(pSleigh.x, pSleigh.y, 4.5 * uiScale, 0, Math.PI * 2);
          ctx.fillStyle = '#d31c1c';
          ctx.fill();
          ctx.lineWidth = 2 * uiScale;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();
          ctx.restore();

          if (STATE.icons.live) {
            ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
            ctx.shadowBlur = 10 * uiScale;
            ctx.shadowOffsetY = 4 * uiScale;
            drawAnchoredImage(ctx, STATE.icons.live, pSleigh.x, pSleigh.y, sleighSize, 0.5, 60 / 64);
          }
        }

        ctx.restore();

        // 4. Optional Social Header & Tracker URL Pill
        if (STATE.includeBanner) {
          ctx.save();
          const padX = 16 * uiScale;
          const topY = 16 * uiScale;
          const cardW = canvasW - padX * 2;
          const hasSub = Boolean(STATE.routeSubtitle && STATE.routeSubtitle.trim());
          const cardH = (hasSub ? 74 : 58) * uiScale;

          // Frosted dark tracker banner card
          ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
          ctx.shadowBlur = 14 * uiScale;
          ctx.shadowOffsetY = 4 * uiScale;
          roundRectPath(ctx, padX, topY, cardW, cardH, 13 * uiScale);
          ctx.fillStyle = 'rgba(13, 16, 23, 0.90)';
          ctx.fill();

          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;
          ctx.lineWidth = 1.5 * uiScale;
          ctx.strokeStyle = 'rgba(251, 175, 51, 0.55)';
          ctx.stroke();

          const textMaxW = cardW - 24 * uiScale;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Sleigh Display Name
          ctx.font = `800 ${Math.round(10.5 * uiScale)}px "Open Sans", sans-serif`;
          ctx.fillStyle = '#FBAF33';
          ctx.fillText(
            fitText(ctx, (STATE.sleighTitle || 'ROUND TABLE SANTA SLEIGH').toUpperCase(), textMaxW),
            canvasW / 2,
            topY + 17 * uiScale
          );

          // Route Title
          ctx.font = `700 ${Math.round(15.5 * uiScale)}px Eurostile, "Open Sans", sans-serif`;
          ctx.fillStyle = '#ffffff';
          ctx.fillText(
            fitText(ctx, STATE.routeTitle || 'Santa Sleigh Route', textMaxW),
            canvasW / 2,
            topY + 38 * uiScale
          );

          // Date / Time / Distance Subtitle
          if (hasSub) {
            ctx.font = `700 ${Math.round(11 * uiScale)}px "Open Sans", sans-serif`;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.80)';
            ctx.fillText(
              fitText(ctx, STATE.routeSubtitle, textMaxW),
              canvasW / 2,
              topY + 57 * uiScale
            );
          }

          // Bottom Tracker URL Pill
          if (STATE.footerUrl && STATE.footerUrl.trim() && (!activeSnap.panOutProgress || activeSnap.panOutProgress < 0.2)) {
            const footerLabel = `📍 Track Santa Live: ${STATE.footerUrl.trim()}`;
            ctx.font = `700 ${Math.round(11 * uiScale)}px "Open Sans", sans-serif`;
            const textW = Math.min(cardW - 24 * uiScale, ctx.measureText(footerLabel).width);
            const pillW = textW + 26 * uiScale;
            const pillH = 28 * uiScale;
            const pillX = (canvasW - pillW) / 2;
            const pillY = canvasH - pillH - 22 * uiScale;

            ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
            ctx.shadowBlur = 10 * uiScale;
            roundRectPath(ctx, pillX, pillY, pillW, pillH, pillH / 2);
            ctx.fillStyle = 'rgba(13, 16, 23, 0.88)';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.lineWidth = 1.2 * uiScale;
            ctx.strokeStyle = 'rgba(251, 175, 51, 0.45)';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(fitText(ctx, footerLabel, pillW - 18 * uiScale), canvasW / 2, pillY + pillH / 2);
          }

          // 4b. Intro Title Splash (Smooth fade-out as sleigh takes off from Start Pin)
          if (activeSnap.t < 1.7 && activeSnap.panOutProgress === 0) {
            const introAlpha = activeSnap.t <= 1.0 ? 1 : Math.max(0, 1 - (activeSnap.t - 1.0) / 0.6);
            if (introAlpha > 0.02) {
              ctx.save();
              ctx.globalAlpha = introAlpha;

              const splashW = Math.min(canvasW - 40 * uiScale, 360 * uiScale);
              const splashH = (hasSub ? 104 : 88) * uiScale;
              const splashX = (canvasW - splashW) / 2;
              const splashY = topY + cardH + 16 * uiScale;

              ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
              ctx.shadowBlur = 20 * uiScale;
              ctx.shadowOffsetY = 6 * uiScale;
              roundRectPath(ctx, splashX, splashY, splashW, splashH, 16 * uiScale);
              ctx.fillStyle = 'rgba(11, 14, 21, 0.94)';
              ctx.fill();

              ctx.shadowBlur = 0;
              ctx.lineWidth = 1.8 * uiScale;
              ctx.strokeStyle = 'rgba(251, 175, 51, 0.85)';
              ctx.stroke();

              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';

              // Badge
              ctx.font = `800 ${Math.round(10 * uiScale)}px "Open Sans", sans-serif`;
              ctx.fillStyle = '#FBAF33';
              ctx.fillText('🎅 OFFICIAL SANTA SLEIGH TOUR', canvasW / 2, splashY + 20 * uiScale);

              // Route Title (Eurostile Bold)
              ctx.font = `700 ${Math.round(19 * uiScale)}px Eurostile, "Open Sans", sans-serif`;
              ctx.fillStyle = '#ffffff';
              ctx.fillText(
                fitText(ctx, STATE.routeTitle || 'Santa Sleigh Route', splashW - 28 * uiScale),
                canvasW / 2,
                splashY + 44 * uiScale
              );

              // Sleigh Table Name (Open Sans)
              ctx.font = `700 ${Math.round(11 * uiScale)}px "Open Sans", sans-serif`;
              ctx.fillStyle = 'rgba(255, 255, 255, 0.82)';
              ctx.fillText(
                fitText(ctx, STATE.sleighTitle || 'Round Table Santa Sleigh', splashW - 28 * uiScale),
                canvasW / 2,
                splashY + 68 * uiScale
              );

              if (hasSub) {
                ctx.font = `600 ${Math.round(9.5 * uiScale)}px "Open Sans", sans-serif`;
                ctx.fillStyle = 'rgba(251, 175, 51, 0.95)';
                ctx.fillText(
                  fitText(ctx, STATE.routeSubtitle, splashW - 28 * uiScale),
                  canvasW / 2,
                  splashY + 88 * uiScale
                );
              }

              ctx.restore();
            }
          }

          // 4c. Outro Finale Card with Table Logo (Smooth fade-in during Pan & Zoom Out)
          if (activeSnap.panOutProgress > 0.15) {
            const outroAlpha = Math.min(1, Math.max(0, (activeSnap.panOutProgress - 0.15) / 0.55));
            if (outroAlpha > 0.02) {
              ctx.save();
              ctx.globalAlpha = outroAlpha;

              const outroW = Math.min(canvasW - 32 * uiScale, 360 * uiScale);
              const hasLogo = Boolean(STATE.icons.logo);
              const outroH = (hasLogo ? 122 : 92) * uiScale;
              const outroX = (canvasW - outroW) / 2;
              const outroY = canvasH - outroH - 32 * uiScale;

              // Frosted gold-bordered finale card
              ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
              ctx.shadowBlur = 24 * uiScale;
              ctx.shadowOffsetY = 8 * uiScale;
              roundRectPath(ctx, outroX, outroY, outroW, outroH, 18 * uiScale);
              ctx.fillStyle = 'rgba(11, 14, 21, 0.95)';
              ctx.fill();

              ctx.shadowBlur = 0;
              ctx.lineWidth = 2 * uiScale;
              ctx.strokeStyle = 'rgba(251, 175, 51, 0.90)';
              ctx.stroke();

              // Official Round Table / Table Custom Logo
              let contentStartY = outroY + 16 * uiScale;
              if (hasLogo) {
                const logoBox = 44 * uiScale;
                const logoCenterY = outroY + 28 * uiScale;
                drawAnchoredImage(ctx, STATE.icons.logo, canvasW / 2, logoCenterY, logoBox, 0.5, 0.5);
                contentStartY = outroY + 58 * uiScale;
              }

              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';

              // Route Completed Header (Eurostile Bold)
              ctx.font = `700 ${Math.round(15.5 * uiScale)}px Eurostile, "Open Sans", sans-serif`;
              ctx.fillStyle = '#ffffff';
              ctx.fillText(
                fitText(ctx, `${STATE.routeTitle || 'Route'} • COMPLETED ✨`, outroW - 24 * uiScale),
                canvasW / 2,
                contentStartY + 6 * uiScale
              );

              // Table Name (Open Sans)
              ctx.font = `800 ${Math.round(10.5 * uiScale)}px "Open Sans", sans-serif`;
              ctx.fillStyle = '#FBAF33';
              ctx.fillText(
                fitText(ctx, (STATE.sleighTitle || 'ROUND TABLE SANTA SLEIGH').toUpperCase(), outroW - 24 * uiScale),
                canvasW / 2,
                contentStartY + 24 * uiScale
              );

              // Live Tracker & Donation CTA Pill
              if (STATE.footerUrl && STATE.footerUrl.trim()) {
                const ctaText = `📍 Track Santa Live & Donate: ${STATE.footerUrl.trim()}`;
                const ctaPillW = outroW - 28 * uiScale;
                const ctaPillH = 24 * uiScale;
                const ctaPillX = (canvasW - ctaPillW) / 2;
                const ctaPillY = contentStartY + 36 * uiScale;

                roundRectPath(ctx, ctaPillX, ctaPillY, ctaPillW, ctaPillH, ctaPillH / 2);
                ctx.fillStyle = 'rgba(251, 175, 51, 0.16)';
                ctx.fill();
                ctx.lineWidth = 1 * uiScale;
                ctx.strokeStyle = 'rgba(251, 175, 51, 0.55)';
                ctx.stroke();

                ctx.font = `700 ${Math.round(10 * uiScale)}px "Open Sans", sans-serif`;
                ctx.fillStyle = '#ffffff';
                ctx.fillText(fitText(ctx, ctaText, ctaPillW - 12 * uiScale), canvasW / 2, ctaPillY + ctaPillH / 2);
              }

              ctx.restore();
            }
          }

          ctx.restore();
        }

        // 5. Required subtle OpenStreetMap attribution in bottom-right corner
        ctx.save();
        ctx.font = `600 ${Math.max(8, Math.round(8.5 * uiScale))}px "Open Sans", sans-serif`;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.fillText('© OpenStreetMap', canvasW - 7 * uiScale, canvasH - 4 * uiScale);
        ctx.restore();
      }

      function drawScreenOverlay(snap) {
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        drawTrackerOverlays(overlayCtx, overlayCanvas.width, overlayCanvas.height, snap);
      }

      function renderCompositeFrame(targetCtx, targetW, targetH, snap) {
        targetCtx.clearRect(0, 0, targetW, targetH);
        const mapCanvas = map.getCanvas();
        targetCtx.drawImage(mapCanvas, 0, 0, targetW, targetH);
        drawTrackerOverlays(targetCtx, targetW, targetH, snap);
      }

      // ─────────────────────────────────────────────────────────
      // LIVE PREVIEW ANIMATION LOOP
      // ─────────────────────────────────────────────────────────
      function animationTick(now) {
        if (!STATE.isExporting && STATE.isPlaying && STATE.points.length > 1) {
          const dt = STATE.lastFrameTs ? Math.min(0.1, (now - STATE.lastFrameTs) / 1000) : 0;
          STATE.lastFrameTs = now;
          STATE.currentTimeSec += dt;

          if (STATE.currentTimeSec >= STATE.durationSecs) {
            STATE.currentTimeSec = STATE.durationSecs;
            setPlaying(false);
          }
          renderCurrentTimelineState();
        } else {
          STATE.lastFrameTs = now;
        }
        requestAnimationFrame(animationTick);
      }

      function setPlaying(play) {
        STATE.isPlaying = Boolean(play);
        STATE.lastFrameTs = performance.now();
        const btn = $('play-btn');
        if (STATE.isPlaying) {
          btn.innerHTML = '<i class="fa-solid fa-pause"></i><span>Pause</span>';
        } else {
          btn.innerHTML = '<i class="fa-solid fa-play"></i><span>Play</span>';
        }
      }

      // ─────────────────────────────────────────────────────────
      // DATA LOADING (MULTI-TENANT PAYLOAD + GPX)
      // ─────────────────────────────────────────────────────────
      function formatShortRouteDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr + 'T00:00:00');
        if (isNaN(d.getTime())) return dateStr;
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
      }

      async function loadTablePayload(slug) {
        const cleanSlug = String(slug || 'beverley').trim().toLowerCase();
        STATE.tableSlug = cleanSlug;
        $('inp-table-slug').value = cleanSlug;

        const select = $('route-select');
        select.innerHTML = '<option value="">Loading routes...</option>';

        try {
          const res = await fetch(`${WORKER_API}/api/payload?table=${encodeURIComponent(cleanSlug)}`, { cache: 'no-store' });
          const data = await res.json();

          const tableObj = data?.table || data?.settings || {};
          STATE.settings = { ...(data?.settings || {}), ...tableObj };

          await loadTableIcons(STATE.settings);

          const sleighName = STATE.settings.sleigh_display_name || STATE.settings.name || `${cleanSlug.charAt(0).toUpperCase() + cleanSlug.slice(1)} Round Table Santa Sleigh`;
          STATE.sleighTitle = sleighName;
          STATE.footerUrl = `${cleanSlug}.roundtablesantasleigh.co.uk`;
          $('inp-sleigh-title').value = STATE.sleighTitle;
          $('inp-footer-url').value = STATE.footerUrl;

          const rawRoutes = Array.isArray(data?.routes) ? data.routes : [];
          const normalized = rawRoutes.map((r, idx) => ({
            id: String(r.id ?? idx),
            name: r.name || r.routeName || `Route ${idx + 1}`,
            date: r.date || '',
            start_time: r.start_time || r['Start Time'] || '',
            end_time: r.end_time || r['End Time'] || '',
            gpxUrl: String(r.gpx_url || r.gpxUrl || '').trim()
          }));

          const withGpx = normalized.filter((r) => Boolean(r.gpxUrl));
          if (withGpx.length > 0) {
            STATE.routes = withGpx;
          } else {
            STATE.routes = FALLBACK_GPX_ROUTES.map((r) => ({ ...r }));
            if (normalized.length > 0) {
              showToast('No GPX tracks attached yet — showing demo routes');
            }
          }

          populateRouteSelect();

          const params = new URLSearchParams(window.location.search);
          const wantedRoute = params.get('route') || params.get('routeId') || '';
          let startIdx = 0;
          if (wantedRoute) {
            const foundIdx = STATE.routes.findIndex((r) => String(r.id) === String(wantedRoute));
            if (foundIdx >= 0) startIdx = foundIdx;
          }
          await selectRouteByIndex(startIdx);
        } catch (err) {
          console.warn('Payload load fallback:', err);
          await loadTableIcons({});
          STATE.routes = FALLBACK_GPX_ROUTES.map((r) => ({ ...r }));
          populateRouteSelect();
          await selectRouteByIndex(0);
        }
      }

      function populateRouteSelect() {
        const select = $('route-select');
        select.innerHTML = '';
        STATE.routes.forEach((r, idx) => {
          const opt = document.createElement('option');
          opt.value = String(idx);
          const dLabel = formatShortRouteDate(r.date);
          opt.textContent = dLabel ? `${dLabel} — ${r.name}` : r.name;
          select.appendChild(opt);
        });
        updatePrevNextButtons();
      }

      function updatePrevNextButtons() {
        $('prev-route-btn').disabled = STATE.activeRouteIndex <= 0;
        $('next-route-btn').disabled = STATE.activeRouteIndex < 0 || STATE.activeRouteIndex >= STATE.routes.length - 1;
      }

      async function selectRouteByIndex(idx) {
        if (idx < 0 || idx >= STATE.routes.length) return;
        setPlaying(false);
        STATE.activeRouteIndex = idx;
        STATE.activeRoute = STATE.routes[idx];
        $('route-select').value = String(idx);
        updatePrevNextButtons();

        const r = STATE.activeRoute;
        try {
          const fetchUrl = resolveAssetUrl(r.gpxUrl);
          const res = await fetch(fetchUrl, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const xmlText = await res.text();
          applyParsedRoute(xmlText, r);
        } catch (err) {
          showToast(`Could not load GPX for ${r.name}`);
          console.error(err);
        }
      }

      function applyParsedRoute(xmlText, routeMeta) {
        const parsed = parseGpxXml(xmlText);
        STATE.points = parsed.points;
        STATE.cameraTrack = parsed.cameraTrack;
        STATE.stops = parsed.stops;
        STATE.totalDistMeters = parsed.totalDistMeters;
        STATE.bounds = parsed.bounds;

        STATE.routeTitle = routeMeta?.name || 'Santa Sleigh Route';
        const datePart = formatShortRouteDate(routeMeta?.date || '');
        const timePart = routeMeta?.start_time
          ? `${routeMeta.start_time}${routeMeta.end_time ? '–' + routeMeta.end_time : ''}`
          : '';
        const kmPart = `${(STATE.totalDistMeters / 1000).toFixed(1)} km`;
        STATE.routeSubtitle = [datePart, timePart, kmPart].filter(Boolean).join(' • ');

        $('inp-route-title').value = STATE.routeTitle;
        $('inp-route-sub').value = STATE.routeSubtitle;

        STATE.currentTimeSec = 0;
        renderCurrentTimelineState();

        // Auto-play live preview smoothly
        setTimeout(() => setPlaying(true), 200);
      }

      // ─────────────────────────────────────────────────────────
      // MP4 VIDEO EXPORT (WEBCODECS H.264 MP4 + MEDIARECORDER FALLBACK)
      // ─────────────────────────────────────────────────────────
      function waitForMapTilesAndRender(timeoutMs = 900) {
        return new Promise((resolve) => {
          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            map.off('render', onRender);
            clearTimeout(timer);
            resolve();
          };

          const isReady = () => (
            map.areTilesLoaded() &&
            map.isSourceLoaded('gpx-route-past') &&
            map.isSourceLoaded('gpx-route-remaining')
          );

          const onRender = () => {
            if (isReady()) {
              finish();
            } else {
              map.triggerRepaint();
            }
          };

          const timer = setTimeout(finish, timeoutMs);
          map.on('render', onRender);
          map.triggerRepaint();
        });
      }

      async function findSupportedH264Config(cfgSpec, fps) {
        if (typeof VideoEncoder === 'undefined' || typeof Mp4Muxer === 'undefined') {
          return null;
        }
        const resolutions = [
          { width: cfgSpec.width, height: cfgSpec.height, bitrate: 8_000_000 },
          { width: cfgSpec.fallbackW, height: cfgSpec.fallbackH, bitrate: 5_000_000 }
        ];
        const codecs = [
          'avc1.640028',
          'avc1.4d0028',
          'avc1.420028',
          'avc1.64002a',
          'avc1.42e028',
          'avc1.64001f',
          'avc1.4d001f',
          'avc1.42001f',
          'avc1.42e01f'
        ];

        for (const res of resolutions) {
          for (const codec of codecs) {
            const candidate = {
              codec,
              width: res.width,
              height: res.height,
              bitrate: res.bitrate,
              framerate: fps
            };
            try {
              const sup = await VideoEncoder.isConfigSupported(candidate);
              if (sup && sup.supported) return candidate;
            } catch (_) {}
          }
        }
        return null;
      }

      async function exportRouteVideo() {
        if (STATE.isExporting || STATE.points.length < 2) return;
        setPlaying(false);

        STATE.isExporting = true;
        STATE.cancelExport = false;
        $('stage-frame').classList.add('is-encoding');
        $('export-btn').disabled = true;

        const backdrop = $('encoding-backdrop');
        const bar = $('encoding-bar');
        const stats = $('encoding-stats');
        const sub = $('encoding-sub');
        bar.style.width = '0%';
        stats.textContent = 'Preparing map tiles...';
        backdrop.classList.add('active');

        const aspectSpec = ASPECT_CONFIGS[STATE.aspect] || ASPECT_CONFIGS['9:16'];
        const fps = 30;
        const origPixelRatio = typeof map.getPixelRatio === 'function' ? map.getPixelRatio() : (window.devicePixelRatio || 2);

        try {
          const h264Config = await findSupportedH264Config(aspectSpec, fps);

          if (h264Config) {
            await runWebCodecsMp4Export(h264Config, fps, bar, stats, sub);
          } else {
            await runMediaRecorderFallbackExport(aspectSpec, fps, bar, stats, sub);
          }
        } catch (err) {
          if (!STATE.cancelExport) {
            console.error('Export error:', err);
            showToast('Video export failed: ' + (err?.message || 'Unknown error'));
          }
        } finally {
          if (typeof map.setPixelRatio === 'function') {
            try { map.setPixelRatio(origPixelRatio); } catch (_) {}
          }
          STATE.isExporting = false;
          $('stage-frame').classList.remove('is-encoding');
          $('export-btn').disabled = false;
          backdrop.classList.remove('active');
          renderCurrentTimelineState();
        }
      }

      async function runWebCodecsMp4Export(h264Config, fps, bar, stats, sub) {
        const { width, height } = h264Config;
        const totalFrames = Math.round(STATE.durationSecs * fps);

        // Match MapLibre internal WebGL pixel ratio to target HD export resolution
        const stageCssW = Math.max(1, $('stage-frame').clientWidth);
        if (typeof map.setPixelRatio === 'function') {
          const targetRatio = Math.min(3.5, Math.max(2, width / stageCssW));
          try { map.setPixelRatio(targetRatio); } catch (_) {}
        }

        // Pre-warm overview & start tiles
        sub.textContent = 'Pre-caching OpenStreetMap tiles...';
        const ov = getOverviewCamera();
        map.jumpTo({ center: ov.center, zoom: ov.zoom, pitch: 0, bearing: 0 });
        await waitForMapTilesAndRender(1100);
        const firstSnap = evaluateStateAtTime(0);
        applyTimelineState(firstSnap);
        await waitForMapTilesAndRender(1100);

        sub.textContent = `Encoding H.264 MP4 (${width}×${height} @ ${fps}fps)`;

        const compCanvas = document.createElement('canvas');
        compCanvas.width = width;
        compCanvas.height = height;
        const compCtx = compCanvas.getContext('2d', { alpha: false });

        const target = new Mp4Muxer.ArrayBufferTarget();
        const muxer = new Mp4Muxer.Muxer({
          target,
          video: {
            codec: 'avc',
            width,
            height
          },
          fastStart: 'in-memory',
          firstTimestampBehavior: 'offset'
        });

        let encoderError = null;
        const encoder = new VideoEncoder({
          output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
          error: (e) => { encoderError = e; }
        });
        encoder.configure(h264Config);

        const frameDurationUs = Math.round(1_000_000 / fps);

        for (let i = 0; i < totalFrames; i++) {
          if (STATE.cancelExport) {
            try { encoder.close(); } catch (_) {}
            showToast('Export cancelled');
            return;
          }
          if (encoderError) throw encoderError;

          const tSec = (i / Math.max(1, totalFrames - 1)) * STATE.durationSecs;
          STATE.currentTimeSec = tSec;
          const snap = evaluateStateAtTime(tSec);
          applyTimelineState(snap);

          // Ensure every visible OSM tile is crisp before capturing frame
          await waitForMapTilesAndRender(750);
          drawScreenOverlay(snap);
          renderCompositeFrame(compCtx, width, height, snap);

          const vf = new VideoFrame(compCanvas, {
            timestamp: i * frameDurationUs,
            duration: frameDurationUs
          });
          encoder.encode(vf, { keyFrame: i % (fps * 2) === 0 });
          vf.close();

          // Respect hardware encoder queue backpressure
          while (encoder.encodeQueueSize > 10 && !STATE.cancelExport) {
            await new Promise((r) => setTimeout(r, 8));
          }

          if (i % 3 === 0 || i === totalFrames - 1) {
            const pct = Math.round(((i + 1) / totalFrames) * 100);
            bar.style.width = `${pct}%`;
            stats.textContent = `${pct}% • Frame ${i + 1} / ${totalFrames}`;
            await new Promise((r) => setTimeout(r, 0));
          }
        }

        stats.textContent = 'Finalizing MP4 container...';
        await encoder.flush();
        encoder.close();
        muxer.finalize();

        const blob = new Blob([target.buffer], { type: 'video/mp4' });
        completeVideoDownload(blob, 'mp4');
      }

      function runMediaRecorderFallbackExport(aspectSpec, fps, bar, stats, sub) {
        return new Promise((resolve, reject) => {
          const width = aspectSpec.fallbackW;
          const height = aspectSpec.fallbackH;
          const compCanvas = document.createElement('canvas');
          compCanvas.width = width;
          compCanvas.height = height;
          const compCtx = compCanvas.getContext('2d', { alpha: false });

          const candidates = [
            { mime: 'video/mp4;codecs=avc1', ext: 'mp4' },
            { mime: 'video/mp4', ext: 'mp4' },
            { mime: 'video/webm;codecs=h264', ext: 'webm' },
            { mime: 'video/webm;codecs=vp9', ext: 'webm' },
            { mime: 'video/webm', ext: 'webm' }
          ];
          const chosen = candidates.find((c) => window.MediaRecorder && MediaRecorder.isTypeSupported(c.mime)) || { mime: '', ext: 'webm' };

          sub.textContent = `Recording live stream (${width}×${height})...`;
          const stream = compCanvas.captureStream(fps);
          const chunks = [];
          const rec = chosen.mime
            ? new MediaRecorder(stream, { mimeType: chosen.mime, videoBitsPerSecond: 6_000_000 })
            : new MediaRecorder(stream);

          rec.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
          };
          rec.onerror = (e) => reject(e.error || new Error('MediaRecorder error'));
          rec.onstop = () => {
            if (STATE.cancelExport) {
              showToast('Export cancelled');
              return resolve();
            }
            const blob = new Blob(chunks, { type: chosen.mime || 'video/webm' });
            completeVideoDownload(blob, chosen.ext);
            resolve();
          };

          rec.start(200);
          const startTs = performance.now();

          const step = (now) => {
            if (STATE.cancelExport) {
              if (rec.state !== 'inactive') rec.stop();
              return;
            }
            const elapsed = (now - startTs) / 1000;
            const tSec = Math.min(STATE.durationSecs, elapsed);
            STATE.currentTimeSec = tSec;
            const snap = evaluateStateAtTime(tSec);
            applyTimelineState(snap);
            drawScreenOverlay(snap);
            renderCompositeFrame(compCtx, width, height, snap);

            const pct = Math.min(100, Math.round((tSec / STATE.durationSecs) * 100));
            bar.style.width = `${pct}%`;
            stats.textContent = `${pct}% • ${tSec.toFixed(1)}s / ${STATE.durationSecs}s`;

            if (elapsed >= STATE.durationSecs) {
              rec.stop();
            } else {
              requestAnimationFrame(step);
            }
          };
          requestAnimationFrame(step);
        });
      }

      function completeVideoDownload(blob, ext) {
        if (STATE.lastExportBlobUrl) {
          URL.revokeObjectURL(STATE.lastExportBlobUrl);
        }
        const blobUrl = URL.createObjectURL(blob);
        STATE.lastExportBlobUrl = blobUrl;

        const cleanTable = (STATE.tableSlug || 'Santa').replace(/[^a-z0-9]/gi, '_');
        const cleanRoute = (STATE.routeTitle || 'Route').replace(/[^a-z0-9]/gi, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
        const filename = `SantaSleigh_${cleanTable}_${cleanRoute}_${STATE.aspect.replace(':', 'x')}.${ext}`;
        STATE.lastExportFilename = filename;

        triggerBlobDownload(blobUrl, filename);

        const vid = $('preview-video');
        vid.src = blobUrl;
        vid.play().catch(() => {});

        $('preview-download-label').textContent = `Download .${ext.toUpperCase()}`;
        $('preview-next-route-btn').style.display = (STATE.activeRouteIndex >= 0 && STATE.activeRouteIndex < STATE.routes.length - 1)
          ? 'inline-flex'
          : 'none';
        $('preview-backdrop').classList.add('active');
        showToast(`Saved ${filename}`);
      }

      function triggerBlobDownload(url, filename) {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      // ─────────────────────────────────────────────────────────
      // UI EVENT WIRING
      // ─────────────────────────────────────────────────────────
      function bindEvents() {
        window.addEventListener('resize', resizeStageToFit);

        // Route Selector & Prev/Next
        $('route-select').addEventListener('change', (e) => {
          const idx = parseInt(e.target.value, 10);
          if (!isNaN(idx)) selectRouteByIndex(idx);
        });
        $('prev-route-btn').addEventListener('click', () => {
          if (STATE.activeRouteIndex > 0) selectRouteByIndex(STATE.activeRouteIndex - 1);
        });
        $('next-route-btn').addEventListener('click', () => {
          if (STATE.activeRouteIndex < STATE.routes.length - 1) selectRouteByIndex(STATE.activeRouteIndex + 1);
        });

        // Local GPX File Upload
        const handleGpxFile = (file) => {
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const name = file.name.replace(/\.gpx$/i, '').replace(/[_-]+/g, ' ');
              applyParsedRoute(String(reader.result || ''), { name, date: '', start_time: '', end_time: '' });
              showToast(`Loaded ${file.name}`);
            } catch (err) {
              showToast('Invalid GPX file: ' + err.message);
            }
          };
          reader.readAsText(file);
        };

        $('gpx-file-input').addEventListener('change', (e) => {
          handleGpxFile(e.target.files?.[0]);
          e.target.value = '';
        });

        // Drag & Drop GPX anywhere
        window.addEventListener('dragover', (e) => {
          e.preventDefault();
          $('drop-banner').classList.add('active');
        });
        window.addEventListener('dragleave', (e) => {
          if (e.relatedTarget === null) $('drop-banner').classList.remove('active');
        });
        window.addEventListener('drop', (e) => {
          e.preventDefault();
          $('drop-banner').classList.remove('active');
          const file = e.dataTransfer?.files?.[0];
          if (file) handleGpxFile(file);
        });

        // Aspect Ratio Buttons
        document.querySelectorAll('[data-aspect]').forEach((btn) => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('[data-aspect]').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            STATE.aspect = btn.dataset.aspect;
            resizeStageToFit();
          });
        });

        // Duration Buttons
        document.querySelectorAll('[data-duration]').forEach((btn) => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('[data-duration]').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            const progressRatio = STATE.durationSecs > 0 ? STATE.currentTimeSec / STATE.durationSecs : 0;
            STATE.durationSecs = parseFloat(btn.dataset.duration) || 25;
            STATE.currentTimeSec = progressRatio * STATE.durationSecs;
            renderCurrentTimelineState();
          });
        });

        // Follow Zoom Buttons
        document.querySelectorAll('[data-zoom]').forEach((btn) => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('[data-zoom]').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            STATE.followZoom = parseFloat(btn.dataset.zoom) || 16.4;
            renderCurrentTimelineState();
          });
        });

        // Banner Toggle
        $('banner-toggle-btn').addEventListener('click', () => {
          STATE.includeBanner = !STATE.includeBanner;
          $('banner-toggle-btn').classList.toggle('active', STATE.includeBanner);
          renderCurrentTimelineState();
        });

        // Caption / Table Drawer
        $('caption-btn').addEventListener('click', () => {
          $('caption-drawer').classList.toggle('open');
        });
        $('caption-close-btn').addEventListener('click', () => {
          $('caption-drawer').classList.remove('open');
        });

        const syncTextInputs = () => {
          STATE.sleighTitle = $('inp-sleigh-title').value;
          STATE.routeTitle = $('inp-route-title').value;
          STATE.routeSubtitle = $('inp-route-sub').value;
          STATE.footerUrl = $('inp-footer-url').value;
          drawScreenOverlay();
        };
        ['inp-sleigh-title', 'inp-route-title', 'inp-route-sub', 'inp-footer-url'].forEach((id) => {
          $(id).addEventListener('input', syncTextInputs);
        });

        $('btn-load-table').addEventListener('click', () => {
          const slug = $('inp-table-slug').value.trim().toLowerCase();
          if (slug) {
            const url = new URL(window.location.href);
            url.searchParams.set('table', slug);
            url.searchParams.delete('route');
            window.history.replaceState({}, '', url.toString());
            loadTablePayload(slug);
          }
        });
        $('inp-table-slug').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') $('btn-load-table').click();
        });

        // Playback Transport
        $('play-btn').addEventListener('click', () => {
          if (STATE.currentTimeSec >= STATE.durationSecs - 0.05) {
            STATE.currentTimeSec = 0;
          }
          setPlaying(!STATE.isPlaying);
        });

        $('restart-btn').addEventListener('click', () => {
          STATE.currentTimeSec = 0;
          renderCurrentTimelineState();
          setPlaying(true);
        });

        $('timeline-scrubber').addEventListener('input', (e) => {
          setPlaying(false);
          const ratio = parseFloat(e.target.value) / 1000;
          STATE.currentTimeSec = ratio * STATE.durationSecs;
          renderCurrentTimelineState();
        });

        // MP4 Export & Preview Modal
        $('export-btn').addEventListener('click', exportRouteVideo);
        $('encoding-cancel-btn').addEventListener('click', () => {
          STATE.cancelExport = true;
        });

        const closePreview = () => {
          $('preview-backdrop').classList.remove('active');
          $('preview-video').pause();
        };
        $('preview-close-x').addEventListener('click', closePreview);
        $('preview-close-btn').addEventListener('click', closePreview);
        $('preview-download-btn').addEventListener('click', () => {
          if (STATE.lastExportBlobUrl) {
            triggerBlobDownload(STATE.lastExportBlobUrl, STATE.lastExportFilename);
          }
        });
        $('preview-next-route-btn').addEventListener('click', () => {
          closePreview();
          if (STATE.activeRouteIndex < STATE.routes.length - 1) {
            selectRouteByIndex(STATE.activeRouteIndex + 1);
          }
        });
      }

      // ─────────────────────────────────────────────────────────
      // BOOTSTRAP
      // ─────────────────────────────────────────────────────────
      STATE.tableSlug = resolveTableSlug();
      bindEvents();
      initMap();
      requestAnimationFrame(animationTick);
    })();
  </script>
</body>
