<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      overflow: hidden; /* Perfect: Stops scrollbars */
      background: transparent; /* Perfect: Transparent base */
      font-family: system-ui, sans-serif;
    }

    .carousel-container {
      width: 100%;
      aspect-ratio: 4/3; 
      max-height: 450px; 
      overflow: hidden;
      border-radius: 12px;
      position: relative;
      background: transparent; /* FIXED: Removed #161614 dark background */
    }

    .carousel-track {
      display: flex;
      height: 100%;
      transition: transform 0.6s ease;
    }

    .carousel-slide {
      min-width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center; 
      justify-content: center;
    }

    .carousel-slide img.bg {
      width: 100%;
      height: 100%;
      object-fit: cover; 
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .carousel-slide img.bg.loaded {
      opacity: 1;
    }

    /* Overlay (Logo) */
    .carousel-overlay {
      position: absolute;
      z-index: 20;
      pointer-events: none;
      opacity: 0.95;
    }

    .pos-top-left { top: 12px; left: 12px; }
    .pos-top-right { top: 12px; right: 12px; }
    .pos-bottom-left { bottom: 12px; left: 12px; }
    .pos-bottom-right { bottom: 12px; right: 12px; }
    .pos-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }
  </style>
</head>

<body>

<div class="carousel-container">
  <div class="carousel-track" id="santa-carousel-track">
    </div>
</div>

<script>
  // --- HELPER: GET DYNAMIC API & TABLE SLUG ---
  function getTableSlug() {
    const params = new URLSearchParams(window.location.search);
    const subMatch = window.location.hostname.match(/^([a-z0-9-]+)\.roundtablesantasleigh\.co\.uk$/i);
    const subSlug = (subMatch && !['www', 'api', 'admin', 'demo', 'turbosanta'].includes(subMatch[1].toLowerCase())) ? subMatch[1].toLowerCase() : '';
    return (params.get('table') || subSlug || 'beverley').toLowerCase().trim();
  }

  function getApiUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("api") || null;
  }

  async function loadTurboSantaCarousel() {
    try {
      const apiUrl = getApiUrl();
      const tableSlug = getTableSlug();
      const workerPayloadUrl = `https://turbosanta-api.beverley247.workers.dev/api/payload?table=${encodeURIComponent(tableSlug)}`;

      let data = null;
      if (apiUrl) {
        const sep = apiUrl.includes('?') ? '&' : '?';
        const res = await fetch(`${apiUrl}${sep}function=getCarouselData`);
        const ct = (res.headers.get('content-type') || '').toLowerCase();
        if (res.ok && ct.includes('json')) {
          data = await res.json();
        }
      }

      if (!data) {
        const res = await fetch(workerPayloadUrl);
        const payload = await res.json();
        const t = payload.table || payload.settings || {};
        let imgs = [];
        if (t.carousel_images) {
          try {
            const parsed = typeof t.carousel_images === 'string' ? JSON.parse(t.carousel_images) : t.carousel_images;
            if (Array.isArray(parsed)) imgs = parsed;
          } catch (e) {}
        }
        if (imgs.length === 0) {
          imgs = [
            t.hero_image_url,
            t.background_url,
            ...(payload.routes || []).map(r => r.mapImageUrl || r.sponsor_logo_url || r.sponsor_logo)
          ].filter((u, idx, arr) => u && typeof u === 'string' && !u.startsWith('blob:') && arr.indexOf(u) === idx);
        }
        data = {
          images: imgs,
          logo_overlay_enabled: Boolean(t.logo_url || t.logo_overlay_url),
          logo_overlay_url: t.logo_overlay_url || t.logo_url || '',
          logo_overlay_position: t.logo_overlay_position || 'top-left',
          logo_overlay_size: t.logo_overlay_size || 64
        };
      }
      
      // Stop if there are no images
      if (!data.images || data.images.length === 0) return;

      const track = document.getElementById("santa-carousel-track");
      let html = "";

      // 2. Build the slides
      data.images.forEach((imgUrl, i) => {
        let logoHtml = "";
        
        // Add the logo overlay if turned on in the Settings tab
        if (String(data.logo_overlay_enabled).toLowerCase() === "true" && data.logo_overlay_url) {
          
          // 🐛 FIX: Safely add the 'pos-' prefix so the CSS class maps correctly
          let pos = data.logo_overlay_position || "top-left";
          if (!pos.startsWith("pos-")) pos = "pos-" + pos;

          logoHtml = `<img class="carousel-overlay ${pos}" src="${data.logo_overlay_url}" style="width: ${data.logo_overlay_size}px;">`;
        }

        html += `
          <div class="carousel-slide">
            <img class="bg" src="${imgUrl}" alt="Santa Slide ${i+1}" onload="this.classList.add('loaded')">
            ${logoHtml}
          </div>
        `;
      });

      // Inject the HTML into the page
      track.innerHTML = html;

      // 3. Start the auto-rotation (every 3.5 seconds)
      let index = 0;
      const totalSlides = data.images.length;
      
      if (totalSlides > 1) {
        setInterval(() => {
          index = (index + 1) % totalSlides;
          track.style.transform = `translateX(-${index * 100}%)`;
        }, 3500);
      }

    } catch (e) {
      console.error("TurboSanta Carousel failed to load:", e);
    }
  }

  // Trigger the script as soon as the page loads
  document.addEventListener("DOMContentLoaded", loadTurboSantaCarousel);
</script>

</body>
</html>
