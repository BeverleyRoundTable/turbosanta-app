<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk to Santa</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
</style>
<script>
  (function() {
    var p = new URLSearchParams(window.location.search);
    var t = (p.get('table') || 'beverley').toLowerCase().trim();
    if (t !== 'beverley' && !p.get('agent_id')) {
      document.addEventListener("DOMContentLoaded", function() {
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;font-family:sans-serif;font-size:14px;text-align:center;padding:20px;">Santa Chat is private to Beverley Round Table.</div>';
      });
    }
  })();
</script>
</head>
<body>
  <!-- Widget mounts into #santa-chat-box filling the embed viewport.
       data-always: the chat section works all season, not just route nights. -->
  <div id="santa-chat-box" data-always="1" style="width:100%;height:100%;min-height:520px;position:relative;"></div>
  <script src="/santa-chat.js" data-always="1" defer></script>
</body>
</html>
