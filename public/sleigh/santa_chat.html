<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk to Santa</title>
<link rel="icon" type="image/png" id="site-favicon" href="https://roundtablesantasleigh.co.uk/icons/Beverley_Santa_Logo.png">
<link rel="apple-touch-icon" id="site-apple-touch-icon" href="https://roundtablesantasleigh.co.uk/icons/Beverley_Santa_Logo.png">
<link rel="preconnect" href="https://api.elevenlabs.io" crossorigin>
<link rel="preconnect" href="https://livekit.rtc.elevenlabs.io" crossorigin>
<link rel="preload" href="/convai-widget-embed.js" as="script">
<script src="/convai-widget-embed.js" async></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #santa-chat-box {
    width: 100%;
    height: 100%;
    position: relative;
  }
  elevenlabs-convai.santa-inline {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    display: block !important;
    --el-overlay-padding: 8px !important;
    --el-sheet-radius: 24px !important;
  }
</style>
</head>
<body>
  <!-- Widget mounts into #santa-chat-box filling the embed viewport.
       data-always: the chat section works all season, not just route nights. -->
  <div id="santa-chat-box" data-always="1" style="width:100%;height:100%;min-height:520px;position:relative;"></div>
  <script src="/santa-chat.js" data-always="1" defer></script>
</body>
</html>
