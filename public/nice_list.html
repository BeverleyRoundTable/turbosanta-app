<!DOCTYPE html>
<html lang="en">
<head>
<script src="/embed-theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TurboSanta — Santa’s Nice List</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=DM+Mono:wght@400;500;700&family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">

  <style>
  @font-face {
    font-family: 'Eurostile';
    src: url('/site/Eurostile_Extended_2_Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

    /* ═══════════════════════════════════════ */
    /* TURBOSANTA DESIGN SYSTEM */
    /* ═══════════════════════════════════════ */
    :root {
      /* Fallback variables, updated dynamically by applyTheme() */
      --primary: #FBAF33;
      --primary-rgb: 251, 175, 51;
      --on-primary: #000000;
      
      --primary-dim: rgba(var(--primary-rgb), 0.12);
      --primary-glow: rgba(var(--primary-rgb), 0.25);
      
      --dark: #0d0d0b;
      --surface: #161614;
      --surface-2: #1e1e1b;
      --surface-3: #252522;
      --border: rgba(255,255,255,0.08);
      --text: #eaeae5;
      --text-dim: rgba(255,255,255,0.55);
      --text-muted: rgba(255,255,255,0.3);
    }
  
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /* 🔧 IMPORTANT: prevent iframe forcing viewport height */
    html, body {
      height: auto;
      min-height: 0;
    }

    body {
      margin: 0;
      padding: 16px 12px;
      background: transparent; /* Keep transparent for iframe embedding */
      color: var(--text);
      font-family: 'Open Sans', sans-serif;
      /* FIXED: Banished the scrollbar */
      overflow-y: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .santa-checker {
      max-width: 720px;
      /* FIXED: Added 40px margin to the bottom so the shadow isn't cut off */
      margin: 0 auto 40px;
      padding: 32px 24px 40px;
      text-align: center;
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    h2 {
      font-family: 'Eurostile', sans-serif;
      font-size: 42px;
      letter-spacing: 2px;
      color: #fff;
      margin: 0 0 24px 0;
      line-height: 1;
    }
    
    h2 span {
      color: var(--primary);
    }

    input {
      width: 100%;
      max-width: 420px;
      padding: 16px 20px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 16px;
      display: block;
      margin: 0 auto;
      transition: all 0.2s ease;
      text-align: center;
    }

    input::placeholder { 
      color: var(--text-muted); 
      font-family: 'Open Sans', sans-serif;
    }
    
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    button {
      margin-top: 20px;
      padding: 16px 32px;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: var(--on-primary);
      font-weight: 700;
      font-family: 'Open Sans', sans-serif;
      font-size: 15px;
      cursor: pointer;
      display: block;
      margin-left: auto;
      margin-right: auto;
      transition: transform 0.1s, filter 0.2s;
    }

    button:hover {
      filter: brightness(0.92);
    }

    button:active {
      transform: scale(0.97);
    }

    #status {
      margin: 24px 0 16px;
      min-height: 1.5em;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #certPreviewWrap {
      display: none;
      margin: 20px auto 0;
      max-width: 560px;
    }

    #certPreviewImg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: 2px solid rgba(var(--primary-rgb), 0.35);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      -webkit-touch-callout: default;
      user-select: auto;
    }

    .save-hint {
      margin: 10px 0 0;
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    .cert-actions {
      display: none;
      margin: 16px auto 0;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .cert-actions button {
      margin: 0;
      padding: 13px 20px;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-dl-secondary {
      background: var(--surface-2) !important;
      color: #fff !important;
      border: 1px solid var(--border) !important;
    }

    .btn-dl-secondary:hover {
      background: var(--surface-3) !important;
      filter: none !important;
    }
    
    @media (max-width: 600px) {
      .santa-checker { padding: 28px 16px; }
      h2 { font-size: 36px; }
      .cert-actions { flex-direction: column; max-width: 360px; }
      .cert-actions button { width: 100%; }
    }
  </style>

</head>

<body>

<div class="santa-checker" id="niceRoot">

  <h2>NAUGHTY OR <span>NICE?</span></h2>

  <input id="childName" placeholder="Enter a name..." autocomplete="off" />
  
  <button onclick="startCheck()">Check Santa’s List</button>

  <p id="status"></p>

  <canvas id="canvas" width="1600" height="1131" style="display:none;"></canvas>

  <div id="certPreviewWrap">
    <img id="certPreviewImg" alt="Santa's Official Nice List Certificate" />
    <p class="save-hint">📱 On mobile: you can press &amp; hold the certificate above to <strong>Save to Photos</strong>.</p>
  </div>

  <div id="certActions" class="cert-actions">
    <button type="button" onclick="shareNiceCert()">📲 Save / Share Image</button>
    <button type="button" class="btn-dl-secondary" onclick="downloadNicePdf()">📄 Download PDF</button>
    <button type="button" class="btn-dl-secondary" onclick="downloadNicePng()">⬇ Download PNG</button>
  </div>
</div>

<script>
  
/* ---------- ASSETS ---------- */
const CANDIDATE_BG_SOURCES = [
  "/nice_list.png",
  "./nice_list.png",
  "/sleigh/nice_list.png",
  "https://raw.githubusercontent.com/BeverleyRoundTable/turbosanta-app/main/public/nice_list.png",
  "https://raw.githubusercontent.com/BeverleyRoundTable/BRT/main/sleigh/nice_list.png"
];

const bgImage = new Image();
bgImage.crossOrigin = "anonymous";
let currentSrcIdx = 0;

bgImage.onerror = () => {
  currentSrcIdx++;
  if (currentSrcIdx < CANDIDATE_BG_SOURCES.length) {
    console.warn("Retrying nice_list.png from fallback:", CANDIDATE_BG_SOURCES[currentSrcIdx]);
    bgImage.src = CANDIDATE_BG_SOURCES[currentSrcIdx];
  }
};
bgImage.src = CANDIDATE_BG_SOURCES[0];

/* ---------- THEME & API SETUP (TurboSanta 2.0 D1) ---------- */
const params = new URLSearchParams(location.search);
const hostParts = location.hostname.split('.');
const subSlug = (hostParts.length >= 3 && hostParts[0] !== 'www' && hostParts[0] !== 'admin' && !location.hostname.includes('pages.dev')) ? hostParts[0] : '';
const tableSlug = params.get("table") || params.get("slug") || subSlug || "beverley";

if (params.get("primary")) {
  applyTheme({ primary_color: params.get("primary"), accent_color: params.get("accent") });
} else {
  const WORKER_URL = `https://turbosanta-api.beverley247.workers.dev/api/payload?table=${encodeURIComponent(tableSlug)}`;
  fetch(WORKER_URL)
    .then(r => r.json())
    .then(data => {
      if (data) {
        const tbl = data.table || {};
        const set = data.settings || {};
        applyTheme({
          primary_color: tbl.primary_color || set.primary_color,
          accent_color: tbl.accent_color || set.accent_color
        });
      }
    })
    .catch(e => console.warn("Failed to load theme for nice list", e));
}

function parseColor(v) {
  if (typeof v !== 'string') return null;
  const s = v.trim();
  const hex = /^#([0-9a-f]{3,8})$/i.exec(s);
  if (hex) {
    let h = hex[1];
    if (h.length === 3 || h.length === 4) h = h.split('').map(c => c + c).join('');
    if (h.length !== 6 && h.length !== 8) return null;
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  try {
    if (/var\(|url\(|expression/i.test(s)) return null;
    if (!(window.CSS && CSS.supports && CSS.supports('color', s))) return null;
    const ctx = document.createElement('canvas').getContext('2d');
    ctx.fillStyle = '#000000';
    ctx.fillStyle = s;
    const out = ctx.fillStyle;
    if (out.charAt(0) === '#') return parseColor(out);
    const rgb = /^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(out);
    return rgb ? [+rgb[1], +rgb[2], +rgb[3]] : null;
  } catch (e) { return null; }
}

function readableTextOn(rgb) {
  const lin = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * lin(rgb[0]) + 0.7152 * lin(rgb[1]) + 0.0722 * lin(rgb[2]);
  return ((L + 0.05) / 0.05) >= (1.05 / (L + 0.05)) ? '#000000' : '#ffffff';
}

function applyTheme(settings) {
  const root = document.documentElement;
  const raw = settings && settings.primary_color;
  const rgb = parseColor(raw);
  
  if (rgb) {
    root.style.setProperty('--primary', String(raw).trim());
    root.style.setProperty('--primary-rgb', rgb.join(', '));
    root.style.setProperty('--on-primary', readableTextOn(rgb));
  } else {
    root.style.removeProperty('--primary');
    root.style.removeProperty('--primary-rgb');
    root.style.removeProperty('--on-primary');
  }
}

/* ---------- MAIN FLOW ---------- */
let latestCert = { name: "", pngDataUrl: "", pdfDataUrl: "", pdfBlob: null };

function getSafeCertFilename(ext) {
  const cleanName = (latestCert.name || "Child")
    .replace(/[^a-zA-Z0-9_-]+/g, "_")
    .replace(/^_+|_+$/g, "") || "Child";
  return `Santa_Nice_List_${cleanName}.${ext}`;
}

function startCheck(){
  const name = document.getElementById("childName").value.trim();
  if(!name) return alert("Please enter a name");

  const status = document.getElementById("status");
  const previewWrap = document.getElementById("certPreviewWrap");
  const certActions = document.getElementById("certActions");

  if (previewWrap) previewWrap.style.display = "none";
  if (certActions) certActions.style.display = "none";
  status.innerText = "Checking Santa’s list… 🤔";
  
  sendHeight();

  const phases = ["Naughty…", "Nice…", "Naughty…", "Nice…"];
  let i = 0;

  const interval = setInterval(() => {
    status.innerText = phases[i % phases.length];
    sendHeight();
    i++;
  }, 400);

  setTimeout(() => {
    clearInterval(interval);
    status.innerText = "✅ NICE LIST CONFIRMED!";
    generatePDF(name);
  }, 2200);
}

async function ensureBgLoaded() {
  if (bgImage.complete && bgImage.naturalWidth > 0) return true;
  return new Promise(resolve => {
    const onLoad = () => {
      bgImage.removeEventListener('load', onLoad);
      bgImage.removeEventListener('error', onError);
      resolve(true);
    };
    const onError = () => {
      bgImage.removeEventListener('load', onLoad);
      bgImage.removeEventListener('error', onError);
      resolve(false);
    };
    bgImage.addEventListener('load', onLoad);
    bgImage.addEventListener('error', onError);
    setTimeout(() => resolve(bgImage.complete && bgImage.naturalWidth > 0), 3000);
  });
}

/* ---------- CERTIFICATE RENDER ---------- */
async function generatePDF(name){
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const previewWrap = document.getElementById("certPreviewWrap");
  const previewImg = document.getElementById("certPreviewImg");
  const certActions = document.getElementById("certActions");

  try {
    if (document.fonts && document.fonts.ready) {
      await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]);
    }
  } catch (_) {}
  await ensureBgLoaded();

  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (bgImage.complete && bgImage.naturalWidth > 0) {
    ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
  }

  // We use Mountains of Christmas if it's loaded, otherwise fallback to Open Sans
  ctx.fillStyle = "#000";
  ctx.font = "bold 80px 'Mountains of Christmas', 'Open Sans', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(name, canvas.width / 2, 620);

  // Canvas → PNG + PDF
  const imgData = canvas.toDataURL("image/png");
  let pdfDataUrl = "";
  let pdfBlob = null;

  try {
    if (window.jspdf && window.jspdf.jsPDF) {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: "landscape",
        unit: "pt",
        format: "a4"
      });
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      pdf.addImage(imgData, "PNG", 0, 0, pageWidth, pageHeight);
      pdfBlob = pdf.output("blob");
      pdfDataUrl = pdf.output("datauristring");
    }
  } catch (pdfErr) {
    console.warn("PDF generation fallback to PNG:", pdfErr);
  }

  latestCert = {
    name,
    pngDataUrl: imgData,
    pdfDataUrl,
    pdfBlob
  };

  if (previewImg && previewWrap) {
    previewImg.onload = () => {
      sendHeight();
      if (window.TurboSantaEmbed && window.TurboSantaEmbed.notifyHeight) {
        window.TurboSantaEmbed.notifyHeight();
      }
    };
    previewImg.src = imgData;
    previewWrap.style.display = "block";
  }

  if (certActions) {
    certActions.style.display = "flex";
  }

  sendHeight();
  setTimeout(sendHeight, 150);
}

function shareNiceCert() {
  if (!latestCert.pngDataUrl || !window.TurboSantaDownload) return;
  window.TurboSantaDownload.shareFile({
    dataUrl: latestCert.pngDataUrl,
    filename: getSafeCertFilename("png"),
    mime: "image/png",
    title: `${latestCert.name}'s Official Santa Nice List Certificate`,
    text: `${latestCert.name} made Santa's Official Nice List!`
  });
}

function downloadNicePdf() {
  if (!window.TurboSantaDownload) return;
  if (!latestCert.pdfBlob && !latestCert.pdfDataUrl) {
    return downloadNicePng();
  }
  window.TurboSantaDownload.downloadFile({
    blob: latestCert.pdfBlob,
    dataUrl: latestCert.pdfDataUrl,
    filename: getSafeCertFilename("pdf"),
    mime: "application/pdf"
  });
}

function downloadNicePng() {
  if (!latestCert.pngDataUrl || !window.TurboSantaDownload) return;
  window.TurboSantaDownload.downloadFile({
    dataUrl: latestCert.pngDataUrl,
    filename: getSafeCertFilename("png"),
    mime: "image/png"
  });
}

/* ---------- AUTO-HEIGHT ---------- */
let lastSentNiceHeight = 0;
function sendHeight(){
  if (window.self === window.top) return;
  const card = document.querySelector('.santa-checker');
  if (!card) return;
  const rect = card.getBoundingClientRect();
  const height = Math.min(Math.ceil(rect.height + 56), 1350);
  if (Math.abs(height - lastSentNiceHeight) >= 16) {
    lastSentNiceHeight = height;
    window.parent.postMessage({ niceListHeight: height, type: 'turbosanta-resize', height: height }, "*");
  }
}

window.addEventListener("load", () => {
  sendHeight();
  setTimeout(sendHeight, 250);
});

const observer = new MutationObserver(sendHeight);
observer.observe(document.body, { childList: true, subtree: true });
</script>

</body>
</html>
